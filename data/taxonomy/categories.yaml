categories:
  - id: software
    name: Software
    folder: software
    description: Open-source healthcare software tools, platforms, and applications

  - id: ai-ml-models
    name: AI / ML Models
    folder: models
    description: Clinical AI models, medical imaging models, biomedical NLP, foundation models

  - id: datasets
    name: Datasets
    folder: datasets
    description: Healthcare datasets, clinical benchmarks, and evaluation corpora

  - id: mcp-servers
    name: MCP Servers
    folder: mcp-servers
    description: Model Context Protocol servers exposing healthcare data and APIs to AI agents

  - id: data-sources
    name: Data Sources
    folder: data-sources
    description: Continuously updated open registries and data feeds — adverse events, trial registries, live clinical data

  - id: catalogs
    name: Catalogs
    folder: catalogs
    description: Open catalogs and registries of healthcare software, models, or standards

  - id: specs
    name: Specs
    folder: standards
    description: Clinical interoperability standards, specifications, and terminology systems

judgements:
  - id: Adopt
    description: >
      Production-ready, well-governed, recommended for new work. Proven at scale,
      actively maintained, clearly the default for its slot.
  - id: Situational
    description: >
      Right in specific contexts but not a general default. Pick deliberately.
  - id: Assess
    description: >
      Promising but not yet proven for production-default use. Track it and prototype,
      but do not commit your architecture to it yet.
  - id: Caution
    description: >
      Avoid for new work. Either superseded, unmaintained (>18 months), or fading.
      Listed because it is still encountered in existing systems.

maturity_levels:
  - experimental
  - beta
  - production
  - legacy

governance_types:
  - foundation
  - vendor-led
  - individual
  - government
  - academic
  - community
