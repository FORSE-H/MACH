name: Suggest a new entry
description: Suggest a new project, model, standard, or MCP server for MACH
title: "[New entry] "
labels: ["new-entry"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an entry! Fill in as much as you can and a curator will handle the rest.

  - type: input
    id: name
    attributes:
      label: Project name
    validations:
      required: true

  - type: input
    id: url
    attributes:
      label: Primary URL
      placeholder: https://...
    validations:
      required: true

  - type: input
    id: repo
    attributes:
      label: Source code repository (if applicable)
      placeholder: https://github.com/...

  - type: textarea
    id: reason
    attributes:
      label: Why should this be in MACH?
      placeholder: 1–3 sentences — what makes it useful, open, and relevant to healthcare.
    validations:
      required: true

  - type: textarea
    id: conflict
    attributes:
      label: Conflict of interest
      description: Are you affiliated with the organisation behind this entry?
      placeholder: No conflict / I work at [org]
    validations:
      required: true
