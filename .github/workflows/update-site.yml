name: Update site

on:
  push:
    branches: [main]
    paths:
      - 'entries/**'
      - 'scripts/generate_entries.py'
      - 'scripts/fetch_swhids.py'
      - 'index.html'

jobs:
  update-site:
    name: Regenerate entries in index.html
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compute and add SWHIDs for new entries
        run: python scripts/fetch_swhids.py

      - name: Run generate_entries.py
        run: python scripts/generate_entries.py

      - name: Commit updated entries and index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add entries/ index.html
          git diff --staged --quiet || git commit -m "ci: add SWHIDs and regenerate index.html [skip ci]"
          git pull --rebase origin main
          git push
