name: Update site

on:
  push:
    branches: [main]
    paths:
      - 'entries/**'
      - 'scripts/generate_entries.py'
      - 'scripts/fetch_swhids.py'
      - 'scripts/taxonomy.py'
      - 'data/taxonomy/categories.yaml'
      - 'index.html'

jobs:
  update-site:
    name: Regenerate entries in index.html
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Compute and add SWHIDs for new entries
        run: python scripts/fetch_swhids.py

      - name: Run generate_entries.py
        run: python scripts/generate_entries.py

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pa11y
        run: npm install -g pa11y

      - name: Run pa11y WCAG 2.1 AA on generated index.html
        run: |
          python3 -m http.server 8080 &
          sleep 2
          pa11y http://localhost:8080/index.html \
            --standard WCAG2AA \
            --reporter cli \
            --chromium-flags "--no-sandbox --disable-setuid-sandbox"

      - name: Commit updated entries and index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add entries/ index.html
          git diff --staged --quiet || git commit -m "ci: add SWHIDs and regenerate index.html [skip ci]"
          git pull --rebase origin main
          git push
