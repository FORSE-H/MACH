<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 84" role="img" aria-label="MACH — Machine-Actionable Catalog for Healthcare">
  <title>MACH</title>
  <defs>
    <linearGradient id="machBook" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1D9E75"/>
      <stop offset="1" stop-color="#0F6E56"/>
    </linearGradient>
  </defs>

  <!-- Mark: an open catalog whose entries are software / data / MCP -->
  <g transform="translate(8,14)">
    <rect x="0" y="0" width="64" height="58" rx="14" fill="#E1F5EE"/>

    <g transform="translate(10,11)">
      <!-- left page -->
      <path d="M22 3 C15 -1 6 -1 1 2 L1 33 C6 30 15 30 22 34 Z" fill="url(#machBook)"/>
      <!-- right page -->
      <path d="M22 3 C29 -1 38 -1 43 2 L43 33 C38 30 29 30 22 34 Z" fill="#0F6E56"/>
      <!-- spine -->
      <rect x="20.5" y="2.5" width="3" height="31" rx="1.5" fill="#04342C"/>

      <!-- LEFT PAGE: software </> + data cylinder -->
      <!-- software: code brackets -->
      <g stroke="#E1F5EE" stroke-width="1.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M8 7 L5 10 L8 13"/>
        <path d="M13 7 L16 10 L13 13"/>
      </g>
      <!-- data: database cylinder -->
      <g fill="none" stroke="#9FE1CB" stroke-width="1.5" stroke-linecap="round">
        <ellipse cx="10.5" cy="20" rx="5" ry="1.8"/>
        <path d="M5.5 20 L5.5 25.5 C5.5 26.5 15.5 26.5 15.5 25.5 L15.5 20"/>
      </g>

      <!-- RIGHT PAGE: MCP connected nodes (agent interface) -->
      <g stroke="#9FE1CB" stroke-width="1.5" fill="#9FE1CB" stroke-linecap="round">
        <line x1="29" y1="9"  x2="35" y2="13"/>
        <line x1="35" y1="13" x2="29" y2="17"/>
        <line x1="35" y1="13" x2="38" y2="20"/>
        <circle cx="29" cy="9"  r="1.9"/>
        <circle cx="35" cy="13" r="1.9"/>
        <circle cx="29" cy="17" r="1.9"/>
        <circle cx="38" cy="20" r="1.9"/>
      </g>
    </g>
  </g>

  <!-- Wordmark -->
  <text x="86" y="54" font-family="'DM Sans','Segoe UI',system-ui,sans-serif"
        font-size="40" font-weight="600" letter-spacing="1" fill="#1a2027">M<tspan fill="#1D9E75">A</tspan>CH</text>
</svg>
