name: Update site

on:
  push:
    branches: [main]
    paths:
      - 'entries/**'
      - 'scripts/generate_entries.py'
      - 'scripts/generate_entry_pages.py'
      - 'scripts/generate_dashboard.py'
      - 'scripts/taxonomy.py'
      - 'data/taxonomy/categories.yaml'
      - 'data/signals.json'
      - 'index.html'
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC — pick up fresh harvested signals
  workflow_dispatch:

concurrency:
  group: update-site
  cancel-in-progress: false

jobs:
  update-site:
    name: Regenerate entries in index.html
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit # tighten to 'block' with allowed-endpoints once baseline is known

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Fetch harvested signals from the harvester repo
        # signals.json is produced by the harvest workflow in mach-render-deploy
        # (public). Fetch the latest; if unavailable, keep any committed copy so
        # the build still succeeds.
        run: |
          curl -fsSL -o data/signals.json \
            https://raw.githubusercontent.com/FORSE-H/mach-render-deploy/main/data/signals.json \
            || echo "WARN: could not fetch signals.json; using committed copy if present"

      - name: Run generate_entries.py
        run: python scripts/generate_entries.py

      - name: Run generate_entry_pages.py
        run: python scripts/generate_entry_pages.py

      - name: Run generate_dashboard.py
        run: python scripts/generate_dashboard.py

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - name: Install pa11y
        run: npm install -g pa11y

      - name: Run pa11y WCAG 2.1 AA on generated index.html
        run: |
          echo '{"chromeLaunchConfig":{"args":["--no-sandbox","--disable-setuid-sandbox"]}}' > /tmp/pa11yrc.json
          python3 -m http.server 8080 &
          sleep 2
          pa11y http://localhost:8080/index.html \
            --standard WCAG2AA \
            --reporter cli \
            --config /tmp/pa11yrc.json

      - name: Commit updated entries and index.html
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add entries/ index.html mach-dashboard.html data/signals.json entry/
          git diff --staged --quiet || git commit -m "ci: regenerate site, entry pages, and signals [skip ci]"
          git pull --rebase origin main
          git push
