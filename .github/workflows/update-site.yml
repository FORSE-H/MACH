name: Update site

# Regenerates the static site from entries + harvested signals and publishes it
# straight to GitHub Pages. Nothing is committed to main — main stays protected
# and no third-party action gains write access. Uses only GitHub first-party
# actions, each pinned to a commit SHA.
on:
  push:
    branches: [main]
    paths:
      - 'entries/**'
      - 'scripts/generate_entries.py'
      - 'scripts/generate_entry_pages.py'
      - 'scripts/generate_dashboard.py'
      - 'scripts/taxonomy.py'
      - 'data/taxonomy/categories.yaml'
      - 'data/signals.json'
      - 'index.html'
  schedule:
    - cron: '0 6 * * 1'   # Mondays 06:00 UTC — pick up fresh harvested signals
  workflow_dispatch:

# Least privilege by default: jobs get read-only unless they opt into more.
permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build site
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit # tighten to 'block' with allowed-endpoints once baseline is known

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pyyaml requests

      - name: Fetch harvested signals from the harvester repo
        # signals.json is produced by the harvest workflow in mach-render-deploy
        # (public). Fetch the latest; if unavailable, keep any committed copy so
        # the build still succeeds.
        run: |
          curl -fsSL -o data/signals.json \
            https://raw.githubusercontent.com/FORSE-H/mach-render-deploy/main/data/signals.json \
            || echo "WARN: could not fetch signals.json; using committed copy if present"

      - name: Run generate_entries.py
        run: python scripts/generate_entries.py

      - name: Run generate_entry_pages.py
        run: python scripts/generate_entry_pages.py

      - name: Run generate_dashboard.py
        run: python scripts/generate_dashboard.py

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '20'

      - name: Install pa11y
        run: npm install -g pa11y

      - name: Run pa11y WCAG 2.1 AA on generated index.html
        run: |
          echo '{"chromeLaunchConfig":{"args":["--no-sandbox","--disable-setuid-sandbox"]}}' > /tmp/pa11yrc.json
          python3 -m http.server 8080 &
          sleep 2
          pa11y http://localhost:8080/index.html \
            --standard WCAG2AA \
            --reporter cli \
            --config /tmp/pa11yrc.json

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      - name: Upload site artifact
        # The whole repo root is the site (index.html + entry/ + logos/ + data/).
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    # Only this job gets the Pages deploy permissions — nothing else can publish.
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
